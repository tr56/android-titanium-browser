name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest'
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # ✅ ИСПРАВЛЕНИЕ 1: фиксированный ключ вместо run_id
      # Инкрементируйте v1→v2 чтобы принудительно сбросить кэш
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-v1
          restore-keys: |
            ${{ runner.os }}-ccache-

      # ✅ ИСПРАВЛЕНИЕ 2: настройка ccache ДО сборки
      - name: Configure ccache
        run: |
          sudo apt-get install -y ccache 2>/dev/null || true
          ccache --version
          # Максимальный размер — важно чтобы не превысить 10GB лимит GitHub
          ccache --set-config=max_size=8G
          # Критично для Chromium: слабый режим слипаний
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime,file_stat_matches
          # Хэш компилятора по содержимому, не пути
          ccache --set-config=compiler_check=content
          # Сжатие для экономии места
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          # Показать текущую конфигурацию
          ccache --show-config
          # Показать статистику (hit rate из предыдущего запуска)
          echo "=== ccache stats (from previous run) ==="
          ccache --show-stats

      - name: Update
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push
          fi

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
          # ✅ ИСПРАВЛЕНИЕ 3: переменные ccache для Chromium
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 8G
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: "true"
        run: |
          status=0
          timeout 315m ./build.sh || status=$?
          if [ $status -eq 124 ]; then
            echo "Достигнут лимит 5ч 15м. Остановка для сохранения кэша ccache..."
          elif [ $status -ne 0 ]; then
            echo "Скрипт завершился с ошибкой: $status"
            exit $status
          fi

      # ✅ ИСПРАВЛЕНИЕ 4: статистика ccache после сборки
      - name: ccache stats
        if: always()
        run: |
          echo "=== ccache статистика ==="
          ccache --show-stats
          echo "=== Размер кэша ==="
          du -sh ~/.cache/ccache

      - name: Set
        if: hashFiles('chromium/src/out/release/*arm64-v8a.apk') != ''
        run: |
          export VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | sed 's/.*\///;s/\-arm64-v8a.apk$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv $(find chromium/src/out/release -name '*arm64-v8a.aab') $VERSION-${{ env.unix_time }}-arm64-v8a.aab
          mv $(find chromium/src/out/release -name '*arm64-v8a.apk') $VERSION-${{ env.unix_time }}-arm64-v8a.apk
          mv $(find chromium/src/out/release -name '*armeabi-v7a.apk') $VERSION-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        if: hashFiles('chromium/src/out/release/*arm64-v8a.apk') != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Attest
        uses: actions/attest-build-provenance@v4
        if: hashFiles('chromium/src/out/release/*arm64-v8a.apk') != ''
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk
