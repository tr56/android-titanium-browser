name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest'
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

# Две сборки одновременно бессмысленны: обе восстановят один кэш и перетрут друг друга
concurrency:
  group: chromium-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Update vanadium
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push
          fi

      # ВАЖНО: версия определяется ПОСЛЕ обновления vanadium,
      # иначе ключ кэша может не совпасть с реально собираемой версией
      - name: Get Chromium version
        run: |
          VERSION=$(grep -m1 -oE '[0-9]+(\.[0-9]+){3}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building Chromium $VERSION"

      # Ключ уникален для каждого запуска -> primary key никогда не совпадёт ->
      # восстановление всегда идёт через restore-keys (самый свежий кэш этой версии),
      # а сохранение в конце всегда создаёт новую запись.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.VERSION }}-
            ccache-

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV

      - name: Build
        id: build
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          status=0
          # 300m, а не 315m: нужен запас на упаковку и загрузку кэша (5-6 ГБ = 5-10 минут),
          # общий лимит job — 360m, и он включает post-шаги
          timeout --kill-after=30 300m ./build.sh || status=$?

          # build.sh создаёт этот маркер прямо перед началом компиляции.
          # Сохранять кэш есть смысл только если компиляция начиналась.
          if [ -f /tmp/compile_started ]; then
            echo "save_cache=true" >> $GITHUB_OUTPUT
          fi

          if [ $status -eq 124 ]; then
            echo "Лимит времени достигнут — сборка не завершена, кэш будет сохранён"
          elif [ $status -ne 0 ]; then
            echo "::error::build.sh завершился с кодом $status"
            exit $status
          fi

      - name: ccache stats
        if: always()
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache
          echo "=== ccache stats (только этот прогон) ==="
          ccache --version | head -1
          ccache --show-stats -v || ccache --show-stats
          echo "=== cache size ==="
          du -sh $HOME/.cache/ccache

      - name: Save ccache
        if: always() && steps.build.outputs.save_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.VERSION }}-${{ github.run_id }}

      - name: Set
        if: hashFiles('chromium/src/out/release/*arm64-v8a.apk') != ''
        run: |
          export VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | sed 's/.*\///;s/\-arm64-v8a.apk$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv $(find chromium/src/out/release -name '*arm64-v8a.aab') $VERSION-${{ env.unix_time }}-arm64-v8a.aab
          mv $(find chromium/src/out/release -name '*arm64-v8a.apk') $VERSION-${{ env.unix_time }}-arm64-v8a.apk
          mv $(find chromium/src/out/release -name '*armeabi-v7a.apk') $VERSION-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        if: hashFiles('chromium/src/out/release/*arm64-v8a.apk') != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Attest
        uses: actions/attest-build-provenance@v4
        if: hashFiles('chromium/src/out/release/*arm64-v8a.apk') != ''
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk
