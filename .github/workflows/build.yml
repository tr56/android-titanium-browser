name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        # Явная привязка к 24.04: с 19.10.2026 ярлык ubuntu-latest переедет на
        # Ubuntu 26, а смена окружения ломает применимость ccache.
        default: 'ubuntu-24.04'

  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

# Не позволяем двум сборкам одновременно создавать конкурирующие ccache.
concurrency:
  group: chromium-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== Available disk space ==="
          df -h /

      - name: Update vanadium
        run: |
          cd vanadium
          git fetch --tags
          git checkout "$(git tag | sort -V | tail -n1)"
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -m "update vanadium"
            # -f: правки в Web UI создают коммиты, и обычный push падает
            # с "! [rejected] main -> main (fetch first)".
            git push -f
          fi

      - name: Get Chromium version
        run: |
          VERSION=$(grep -m1 -oE '[0-9]+(\.[0-9]+){3}' vanadium/args.gn)
          if [ -z "$VERSION" ]; then
            echo "::error::Не удалось определить Chromium VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Chromium $VERSION"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.VERSION }}-
            ccache-

      - name: Set environment
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          # Сразу разрешаем сохранение ccache, чтобы при любом прерывании шаг сохранения сработал
          echo "save_cache=true" >> "$GITHUB_OUTPUT"
          set -o pipefail
          status=0
          # 320 минут = 5 часов 20 минут. Это гарантирует 40 минут запаса до любого
          # внешнего лимита GitHub Actions (6 часов), сохраняя кэш и формируя релиз.
          timeout --kill-after=30 320m ./build.sh 2>&1 | tee /tmp/build.log || status=$?

          LAST=$(grep -oE '^\[[0-9]+/[0-9]+\]' /tmp/build.log 2>/dev/null | tail -1 || true)

          if [ "$status" -eq 124 ] || [ "$status" -eq 143 ]; then
            {
              echo "## ⏱ Достигнут лимит времени шага — сборка не завершена"
              echo ""
              echo "Последний прогресс компиляции: **${LAST:-нет данных}**"
              echo ""
              echo "Это **ожидаемый** этап стратегии «несколько заходов»:"
              echo "ccache уже сохранён, и следующий прогон пропустит собранное."
              echo ""
              echo "**Что делать:** Actions → Build → Run workflow. Файлы менять не нужно."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Лимит времени (${LAST:-нет данных}). Кэш ccache сохранён. Запустите Run workflow ещё раз — файлы менять НЕ нужно, кэш подхватится автоматически."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::build.sh завершился с кодом $status"
            tail -40 /tmp/build.log
            exit "$status"
          fi

          echo "### ✔ Сборка завершена: ${LAST:-готово}" >> "$GITHUB_STEP_SUMMARY"

      - name: ccache stats
        if: always()
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          echo "=== ccache stats (current run) ==="
          ccache --version | head -1
          ccache --show-stats -v || ccache --show-stats
          echo "=== cache size ==="
          du -sh "$CCACHE_DIR" || true

          # Сводка в Job Summary: по ней сразу видно, подхватился ли кэш.
          STATS=$(ccache --print-stats 2>/dev/null || true)
          HITS=$(echo "$STATS" | awk -F'\t' '/^(direct_cache_hit|preprocessed_cache_hit|remote_storage_hit)/{h+=$2} END{print h+0}')
          MISS=$(echo "$STATS" | awk -F'\t' '/^cache_miss/{print $2+0}')
          {
            echo ""
            echo "### ccache в этом прогоне"
            echo ""
            echo "| показатель | значение |"
            echo "|---|---|"
            echo "| попаданий (hits) | ${HITS:-0} |"
            echo "| промахов (misses) | ${MISS:-0} |"
            echo ""
            echo "Холодный прогон ≈ 0 попаданий. Со второго прогона должно быть много попаданий."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: always() && steps.build.outputs.save_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.VERSION }}-${{ github.run_id }}

      # Держим в репозитории один актуальный кэш: он надмножество предыдущих.
      # Без этого 3-4 прогона упрутся в лимит GitHub в 10 GiB и кэш вытеснится.
      - name: Purge old ccache entries
        if: always() && steps.build.outputs.save_cache == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP="ccache-${{ env.VERSION }}-${{ github.run_id }}"
          echo "Оставляем: $KEEP"
          gh cache list -R "${{ github.repository }}" --limit 100 --json id,key \
            --jq ".[] | select(.key | startswith(\"ccache-\")) | select(.key != \"$KEEP\") | .id" \
            | while read -r id; do
                echo "Удаляю старый кэш id=$id"
                gh cache delete "$id" -R "${{ github.repository }}" || true
              done

      # Ищем только непустой APK и копируем его в корень workspace.
      # cp, а не mv: файл в chromium/src/out/release остаётся на месте.
      - name: Prepare release APK
        id: release
        if: success()
        shell: bash
        run: |
          set -eo pipefail
          APK=$(find chromium/src/out/release \
            -maxdepth 1 \
            -type f \
            -name '*-arm64-v8a.apk' \
            -size +0c \
            -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Не найден непустой подписанный arm64-v8a APK"
            echo "=== out/release ==="
            find chromium/src/out/release -maxdepth 1 -type f -ls 2>/dev/null || true
            exit 1
          fi
          VERSION_FROM_FILE=$(basename "$APK" | sed 's/-arm64-v8a\.apk$//')
          if [ -z "$VERSION_FROM_FILE" ]; then
            echo "::error::Не удалось получить версию из $APK"
            exit 1
          fi
          RELEASE_APK="${VERSION_FROM_FILE}-${{ env.unix_time }}-arm64-v8a.apk"
          cp "$APK" "$RELEASE_APK"
          if [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Подготовленный для релиза APK пустой"
            exit 1
          fi
          echo "VERSION=$VERSION_FROM_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "apk_found=true" >> "$GITHUB_OUTPUT"
          echo "=== Ready for GitHub Release ==="
          ls -lh "$RELEASE_APK"
          sha256sum "$RELEASE_APK"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: steps.release.outputs.apk_found == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: ${{ env.RELEASE_APK }}

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@v4
        if: steps.release.outputs.apk_found == 'true'
        with:
          subject-path: ${{ env.RELEASE_APK }}
